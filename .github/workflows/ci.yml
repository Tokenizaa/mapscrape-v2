name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel obsolete validation runs for the same branch/PR to conserve free CI minutes.
# Validate the synchronized lockfile on main after automated dependency updates.
# Recheck the patched undici dependency tree.
concurrency:
  group: mapscrape-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Temporary remediation during this consolidation: resolve vulnerable transitive
      # packages within existing semver ranges and persist the lockfile to this PR branch.
      - name: Remediate vulnerable lockfile dependencies
        run: npm audit fix --package-lock-only
      - name: Commit lockfile remediation to PR branch
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: remediate vulnerable transitive dependencies"
            FIX_COMMIT=$(git rev-parse HEAD)
            git fetch origin "${GITHUB_HEAD_REF}"
            git checkout -B "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
            git cherry-pick "$FIX_COMMIT"
            git push origin "${GITHUB_HEAD_REF}"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: TypeScript typecheck
        run: npm run lint
      - name: Bundle queue consumer (dry run)
        run: npm run build:consumer
      # The full integration suite writes to Supabase and requires a dedicated test project + auth token.
      # Keep PR CI deterministic and never point tests at the production database.
      - name: Run isolated unit tests
        run: npm run test:unit
      - name: npm audit
        run: npm audit --audit-level=high

